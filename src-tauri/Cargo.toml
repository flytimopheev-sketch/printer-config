[package]
name = "printer-config"
version = "1.2.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Современный frameless-менеджер принтеров (Windows Spooler / Linux CUPS) — Rust/Tauri-реализация system-config-printer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"
mdns-sd = "0.21"
flume = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Printing",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
] }

[lib]
name = "printer_config_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Без custom-protocol crate `tauri` считает себя в dev-режиме (cfg(dev)) и даже
# release-бинарник пытается грузить devUrl (http://localhost:5173) вместо
# встроенных ассетов dist/ — «Could not connect to localhost».
[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
