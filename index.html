<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Printer Config</title>
    <style>
      /* Заставка на время запуска. Окно WebView появляется раньше, чем
         готов интерфейс (на слабых машинах и в ВМ это заметные секунды),
         и без заставки пользователь видел пустое белое окно. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1116;
        overflow: hidden;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, "Segoe UI", Cantarell, sans-serif;
        user-select: none;
      }
      .splash__spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #26303d;
        border-top-color: #2563eb;
        animation: splash-spin 0.8s linear infinite;
      }
      .splash__name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #dbe3ef;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="splash__spinner"></div>
        <div class="splash__name">Printer Config</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
